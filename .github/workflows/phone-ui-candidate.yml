name: Build optional phone workspace
on:
  push:
    branches: [feature/phone-workspace]
    paths: ['relief-studio/source/public/phone-*', 'relief-studio/source/tools/build_phone_layer.py', '.github/workflows/phone-ui-candidate.yml']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Assemble the phone-only extension
        run: python3 relief-studio/source/tools/build_phone_layer.py
      - uses: actions/upload-artifact@v4
        with:
          name: phone-build
          path: relief-studio/
          retention-days: 1
      - name: All existing application and encrypted gate tests
        working-directory: relief-studio/source
        run: npm test > "$RUNNER_TEMP/phone-suite.log" || { tail -100 "$RUNNER_TEMP/phone-suite.log"; exit 1; }
      - name: Stage generated files on a candidate branch only
        run: |
          set -eu
          tail -10 "$RUNNER_TEMP/phone-suite.log"
          git config user.name 'Relief Studio CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add relief-studio/index.html relief-studio/gate-v28.js relief-studio/upgrade28-phone.json relief-studio/source/public/app.js relief-studio/source/tools/prepare_release28.mjs
          git commit -m 'Ship a touch-only phone workspace with unchanged desktop presentation'
          git push origin HEAD:refs/heads/candidate/phone-workspace-${GITHUB_RUN_ID}
