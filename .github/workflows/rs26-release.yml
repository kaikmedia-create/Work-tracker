name: Verify and stage measured landmark geometry
on:
  push:
    branches: [qa/landmark-surfaces-26]
    paths: ['.github/workflows/rs26-release.yml']
permissions: {contents: write, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {path: review, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {path: candidate, ref: 833b7bf5fc77027fc1c7d6d291d7a01bbf46b6e8, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with: {name: lgl-reference, run-id: 41843669328, github-token: '${{ github.token }}', path: public-data}
      - uses: actions/download-artifact@v4
        with: {name: height-source, run-id: 41844073594, github-token: '${{ github.token }}', path: public-data}
      - name: Reconstruct bounded regional reference from the exact public LGL archives
        run: |
          pip -q install 'numpy==2.3.5' 'scipy==1.17.0' 'pyproj==3.7.2' 'rasterio==1.5.0' 'lxml==6.1.1' 'shapely==2.1.2'
          cd public-data
          echo 'a915a3fec24522dd4f19ce3cda0b8bb2d802f62c27e8222daf46b263b709f690  LoD2_32_475_5488_2_bw.zip' | sha256sum -c
          echo 'e1e17fc15dcd7f146d5a24f5f382628e867d51c427e01b5b7d7682a6460cf8f0  ndom1_32_475_5488_2_bw.zip' | sha256sum -c
          unzip -qo ndom1_32_475_5488_2_bw.zip -d raster
          python ../review/.rs26/pack.py LoD2_32_475_5488_2_bw.zip raster --crs EPSG:25832 --functions 31001_3041,51001_1009,31001_3044 --source 'Datenquelle: LGL, www.lgl-bw.de · nDOM1 und LoD2, Kachel 32/475/5488 · dl-de/by-2-0 (https://www.govdata.de/dl-de/by-2-0). Dachraster aus Oberflächenhöhen abgeleitet und für den Druck resampelt.' --output ../review/.rs26/pack.json
          echo '722027224e24e285977bf7ca750e9f76e9ba9dcb3a78c2ba4819657f49322fc7  ../review/.rs26/pack.json' | sha256sum -c
      - name: Verify the exact 32 locally tested files
        working-directory: candidate
        run: |
          node relief-studio/source/tools/prepare_release25.mjs
          python ../review/.rs26/assemble.py relief-studio
          git add -- relief-studio
          python - <<'PY'
          import hashlib as h,pathlib,subprocess as s
          paths=s.check_output(['git','diff','--cached','--name-only']).decode().splitlines();assert len(paths)==32 and all(p.startswith('relief-studio/') for p in paths),paths
          digest=h.sha256(''.join(p.removeprefix('relief-studio/')+':'+h.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'\n' for p in sorted(paths)).encode()).hexdigest()
          print(digest);assert digest=='a52866bdcef9cd798a8b7877687b6d884fdb3e50851de131730cdba24958ff8d'
          PY
      - name: Run full regression suite on the checksum-verified build
        working-directory: candidate/relief-studio/source
        run: npm test
      - name: Stage only the tested files on the candidate branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess as s,urllib.request as u
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'
          def post(route,obj):
           req=u.Request(base+route,data=json.dumps(obj).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['GH_TOKEN']});return json.load(u.urlopen(req,timeout=45))
          paths=s.check_output(['git','diff','--cached','--name-only']).decode().splitlines();assert len(paths)==32 and all(p.startswith('relief-studio/') for p in paths)
          tree=post('trees',{'base_tree':s.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),'tree':[{'path':p,'mode':'100644','type':'blob','content':s.check_output(['git','show',':'+p]).decode()} for p in paths]})['sha']
          commit=post('commits',{'message':'Preserve mapped landmark assemblies and courtyards; clip regional roof-height surfaces to actual footprints','tree':tree,'parents':[s.check_output(['git','rev-parse','HEAD']).decode().strip()]})['sha'];post('refs',{'ref':'refs/heads/feature/verified-landmark-roofs-26','sha':commit});print(commit)
          PY
