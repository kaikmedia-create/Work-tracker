name: Footprint-first measured height acceptance
on:
  push:
    branches: [feature/footprint-measured-heights]
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      candidate: ${{ steps.stage.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install only checksum-matched application source
        working-directory: relief-studio/source
        run: |
          node tools/prepare_release28.mjs
          python3 tools/install_hybrid.py
          npm test > /tmp/hybrid-tests.log
          tail -10 /tmp/hybrid-tests.log
      - name: Stage an isolated candidate, never deploy to main
        id: stage
        run: |
          git add relief-studio/source/public/core.js relief-studio/source/public/architecture.js relief-studio/source/public/index.html relief-studio/source/public/app.js relief-studio/source/public/worker.js relief-studio/source/public/atlas-mesh-worker.mjs relief-studio/source/public/hybrid-buildings.mjs relief-studio/source/public/surface-build.mjs relief-studio/source/package.json relief-studio/source/tools/prepare_release28.mjs relief-studio/upgrade28-hybrid.json relief-studio/gate-v28.js relief-studio/index.html
          git config user.name 'Relief Studio CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate tested classic default and footprint-first measured height integration'
          git push origin HEAD:refs/heads/candidate/footprint-height-${GITHUB_RUN_ID}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hybrid-unit-tests, path: /tmp/hybrid-tests.log, retention-days: 7}
  world:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: {shard: [0,1,2,3,4,5]}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: {image: 'mcr.microsoft.com/playwright/python:v1.57.0-noble', options: '--ipc=host'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Cold live worldwide sources, real STL buttons, independent topology
        run: |
          python -m pip -q install playwright==1.57.0 numpy scipy
          python -m http.server 8120 --bind 127.0.0.1 > /tmp/http.log 2>&1 & S=$!; trap 'kill "$S" || true' EXIT
          python relief-studio/source/tests/atlas-browser.py http://127.0.0.1:8120/relief-studio/ /tmp/world ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'hybrid-world-${{ matrix.shard }}'
          path: |
            /tmp/world/*.json
            /tmp/world/*.png
          retention-days: 7
  fusion:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: chromium, device: desktop}
          - {engine: chromium, device: mobile}
          - {engine: webkit, device: mobile}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: {image: 'mcr.microsoft.com/playwright/python:v1.57.0-noble', options: '--ipc=host'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate }}', persist-credentials: false}
      - name: Verify footprint preservation, height decisions, round trip and diagnostics
        run: |
          python -m pip -q install playwright==1.57.0 numpy scipy
          python -m http.server 8120 --bind 127.0.0.1 > /tmp/http.log 2>&1 & S=$!; trap 'kill "$S" || true' EXIT
          python relief-studio/source/tests/hybrid-browser.py http://127.0.0.1:8120/relief-studio/ /tmp/fusion ${{ matrix.engine }} ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'height-fusion-${{ matrix.engine }}-${{ matrix.device }}'
          path: |
            /tmp/fusion/*.json
            /tmp/fusion/*.png
          retention-days: 7
