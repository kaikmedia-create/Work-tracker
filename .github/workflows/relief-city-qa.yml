name: Relief live city QA
on:
  push:
    branches: [relief-qa-v19]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relief-city-qa
  cancel-in-progress: false
jobs:
  cities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: node tools/prepare_release18.mjs
        working-directory: relief-studio/source
      - run: python tests/live_city_collect_v19.py
        working-directory: relief-studio/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relief-city-qa
          path: relief-studio/source/reports/city-qa
          retention-days: 7
