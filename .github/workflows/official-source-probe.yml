name: Official solid source probe
on:
  push:
    branches: [feature/official-solids-v1]
    paths: ['.github/workflows/official-source-probe.yml']
permissions: {contents: read}
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch pinned library and bounded Japanese source examples
        run: |
          mkdir -p evidence/vendor
          npm pack manifold-3d@3.5.4 --pack-destination evidence/vendor
          python3 - <<'PY'
          import json,urllib.request,pathlib,traceback
          out=pathlib.Path('evidence');report=[]
          def get(url,limit):
            req=urllib.request.Request(url,headers={'User-Agent':'ReliefStudio-Official-Source-Acceptance/1','Accept':'application/json,application/xml,*/*'})
            with urllib.request.urlopen(req,timeout=45) as r:
              b=r.read(limit+1)
              if len(b)>limit:raise ValueError('Source exceeds QA byte budget')
              return b
          probes=[('hachioji',[139.315,35.669,139.317,35.671]),('matsumoto',[137.967,36.236,137.969,36.238]),('nagano',[138.18,36.65,138.182,36.652]),('kyoto',[135.77,35.02,135.772,35.022])]
          for name,bbox in probes:
            url='https://api.plateauview.mlit.go.jp/datacatalog/citygml/r:'+','.join(map(str,bbox))+'?types=bldg';row={'provider':'plateau','name':name,'bounds':bbox,'catalog':url};report.append(row)
            try:
              b=get(url,2000000);(out/(name+'-catalog.json')).write_bytes(b);j=json.loads(b);rows=j.get('cities',[]) if isinstance(j,dict) else j
              files=[dict(f,year=r.get('year'),cityName=r.get('cityName')) for r in rows for f in r.get('files',{}).get('bldg',[]) if f.get('maxLod',0)>=2]
              row['available']=[{'size':f.get('fileSize'),'code':f.get('code'),'year':f['year']} for f in files];row['downloaded']=[]
              files=[f for f in files if f.get('fileSize',0)<=16000000]
              for f in files[:1]:
                b=get(f['url'],16000000);namefile=name+'-source.gml';(out/namefile).write_bytes(b);row['downloaded'].append({'url':f['url'],'bytes':len(b),'file':namefile,'year':f['year'],'cityName':f['cityName']})
              row['ok']=bool(row['downloaded'])
            except Exception as e:row.update(ok=False,error=str(e));traceback.print_exc()
          (out/'probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: official-source-probe,path: evidence,retention-days: 7}
