name: Global coordinate source acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/coordinate-source-pipeline]
    paths: ['.github/workflows/global-coordinate-acceptance.yml']
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    timeout-minutes: 12
    outputs: {candidate: '${{ steps.save.outputs.candidate }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare source and vendored polygon clipper
        working-directory: relief-studio/source
        run: |
          set -eu
          node tools/prepare_release28.mjs
          d=$(mktemp -d); (cd "$d" && npm pack polygon-clipping@0.15.7 --silent && tar xzf *.tgz)
          { echo 'const module={exports:{}};const exports=module.exports;'; cat "$d/package/dist/polygon-clipping.umd.min.js"; echo; echo 'export default module.exports;'; } >public/atlas-clip.mjs
          cp "$d/package/LICENSE.md" public/atlas-clip-LICENSE.txt
          python3 tools/build_atlas_release.py
          node tools/prepare_release28.mjs
          for f in public/atlas-*.mjs; do node --check "$f"; done
      - name: Test exact deployed PIN source and baseline
        working-directory: relief-studio/source
        run: |
          npm test >/tmp/suite.log || { grep -A10 '^not ok' /tmp/suite.log | cut -c1-300 | head -120; exit 1; }
          tail -10 /tmp/suite.log
      - name: Save public candidate, never deploy from CI
        id: save
        run: |
          git config user.name 'Relief Studio CI'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add relief-studio/source/public/atlas* relief-studio/source/public/{core,app,data}.js relief-studio/source/public/index.html relief-studio/source/server.mjs relief-studio/source/tools/prepare_release28.mjs relief-studio/{gate-v28.js,index.html,upgrade28-atlas.json}
          git commit -m 'Integrate tested coordinate-based global model and verified preview package'
          git push origin HEAD:refs/heads/candidate/global-${GITHUB_RUN_ID}
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/atlas-bundle; tar -czf /tmp/atlas-bundle/source.tgz --exclude=survey29 -C relief-studio/source public; cp /tmp/suite.log /tmp/atlas-bundle/
      - uses: actions/upload-artifact@v4
        with: {name: atlas-code, path: /tmp/atlas-bundle/, retention-days: 3}
  cities:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy: {fail-fast: false, max-parallel: 3, matrix: {shard: [0,1,2,3,4,5]}}
    container: {image: 'mcr.microsoft.com/playwright/python:v1.57.0-noble', options: '--ipc=host'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build.outputs.candidate }}', persist-credentials: false}
      - name: Cold-load actual archives and terrain; click STL; verify printable topology
        run: |
          python -m pip -q install playwright==1.57.0 numpy
          python -m http.server 8120 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 & S=$!; trap 'kill "$S" || true' EXIT
          python relief-studio/source/tests/atlas-browser.py http://127.0.0.1:8120/relief-studio/ evidence ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'globe-${{ matrix.shard }}', path: evidence/, retention-days: 4}
