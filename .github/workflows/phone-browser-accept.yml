name: Phone workspace acceptance
on:
  push:
    branches: [qa/phone-acceptance]
    paths: ['.github/workflows/phone-browser-accept.yml','relief-studio/source/tests/phone_browser.py']
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {path: review, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: b655d7433405fa51edd776d6a502ad82bc525ccb, path: baseline, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: d778438bbfe115766a66a389e31a361b20a10c08, path: candidate}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Reconstruct exact corrected mobile UI
        working-directory: candidate/relief-studio
        run: |
          set -eu
          for f in index.html gate-v28.js source/public/app.js source/tools/prepare_release28.mjs; do cp "../../baseline/relief-studio/$f" "$f"; done
          cat >>source/public/phone-workspace.css <<'CSS'
          [data-phone] .header-actions :is(#new-project,#export-top):not([hidden]) {display:block;}
          [data-phone] .welcome-copy p br {display:initial;}
          [data-phone] .steps button {width:100%;min-width:44px;}
          [data-phone] .search button {min-width:44px;}
          [data-phone] .model-controls {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));}
          [data-phone] .model-controls output {align-self:center;}
          CSS
          cp ../../review/relief-studio/source/tests/phone_browser.py source/tests/
          python3 source/tools/build_phone_layer.py
          test "$(git hash-object source/public/phone-workspace.css)" = db3149102249e712e5c8a4db10d6c89ff92f52d1
          test "$(git hash-object source/public/app.js)" = 3cf943cf0556724b32354b1af0c2cafacc246643
          git rm ../.github/workflows/phone-ui-candidate.yml
      - name: Run the complete regression suite and stage a reproducible candidate, not main
        working-directory: candidate
        run: |
          set -eu
          (cd relief-studio/source && npm test) > "$RUNNER_TEMP/suite.log" || { tail -100 "$RUNNER_TEMP/suite.log"; exit 1; }
          mkdir -p relief-studio/reports/phone
          tail -9 "$RUNNER_TEMP/suite.log" | tee relief-studio/reports/phone/test-summary.txt
          git config user.name 'Relief Studio CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add relief-studio/index.html relief-studio/gate-v28.js relief-studio/upgrade28-phone.json relief-studio/source/public/{app.js,phone-workspace.css} relief-studio/source/tests/phone_browser.py relief-studio/reports/phone/test-summary.txt
          git commit -m 'Add tested phone controls and keep desktop assets unchanged'
          git push origin HEAD:refs/heads/candidate/phone-verified-${GITHUB_RUN_ID}
      - name: Pin both browser engines and their operating system together
        run: |
          docker pull mcr.microsoft.com/playwright/python:v1.57.0-noble
          python3 -m http.server 8788 --bind 127.0.0.1 > "$RUNNER_TEMP/phone-http.log" 2>&1 &
          server=$!; trap 'kill "$server" || true' EXIT
          mkdir -p phone-results
          docker run --rm --network=host --ipc=host -v "$PWD/baseline/relief-studio:/baseline:ro" -v "$PWD/candidate/relief-studio:/candidate:ro" -v "$PWD/phone-results:/results" -e PHONE_RESULTS=/results mcr.microsoft.com/playwright/python:v1.57.0-noble bash -ec 'pip install -q playwright==1.57.0; for e in chromium webkit; do PHONE_ENGINE=$e python /candidate/source/tests/phone_browser.py; done'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: phone-browser-evidence, path: phone-results/, retention-days: 3}
      - name: Stage the two browser reports on a candidate only
        working-directory: candidate
        run: |
          set -eu
          cp ../phone-results/*.json relief-studio/reports/phone/
          git add relief-studio/reports/phone/*.json
          git commit -m 'Record Chromium and WebKit phone export and navigation checks'
          git push origin HEAD:refs/heads/candidate/phone-tested-${GITHUB_RUN_ID}
