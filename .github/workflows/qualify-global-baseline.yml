name: Qualify coordinate-based relief
on:
  workflow_dispatch:
  push:
    branches: [qa/global-topology-and-cache]
    paths: ['.github/workflows/qualify-global-baseline.yml']
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    outputs: {commit: '${{ steps.candidate.outputs.commit }}'}
    steps:
      - uses: actions/checkout@v4
        with: {path: new}
      - uses: actions/checkout@v4
        with: {path: original, ref: b95db64dc13838621846a805551eb974ffa8467b, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check catalog licensing; generate verified worker and test all gates
        working-directory: new/relief-studio/source
        run: |
          set -eu
          (cd "$GITHUB_WORKSPACE/original/relief-studio/source" && node tools/prepare_release28.mjs)
          python tools/pin_atlas_catalog.py
          python tools/finalize_atlas.py "$GITHUB_WORKSPACE/original/relief-studio/source"
          npm pkg set 'scripts.test='"$(node -p 'require("./package.json").scripts.test') tests/atlas-contract.test.mjs"
          mkdir -p "$GITHUB_WORKSPACE/output"
          npm test >"$GITHUB_WORKSPACE/output/suite.txt" || { grep -A22 '^not ok' "$GITHUB_WORKSPACE/output/suite.txt" | cut -c1-350 | head -200; exit 1; }
          tail -10 "$GITHUB_WORKSPACE/output/suite.txt"
      - name: Stage tested version; without a main write
        id: candidate
        working-directory: new
        run: |
          git config user.name 'Relief Studio CI'; git config user.email 'github-actions[bot]@users.noreply.github.com'; git add relief-studio; git commit -m 'Qualify coordinate-first city models, per-tile survey coverage, STAC attribution and contact envelopes'
          git push origin HEAD:refs/heads/candidate/verified-atlas-${GITHUB_RUN_ID}; echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: global-unit-report, path: output/, retention-days: 3}
  locations:
    needs: package
    strategy: {fail-fast: false, max-parallel: 6, matrix: {shard: [0,1,2,3,4,5]}}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container: {image: 'mcr.microsoft.com/playwright/python:v1.57.0-noble', options: '--ipc=host'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.package.outputs.commit }}', persist-credentials: false}
      - name: Real archives to independently verified STL
        run: |
          python -m pip -q install playwright==1.57.0 numpy
          python -m http.server 8120 --bind 127.0.0.1 >/tmp/rs-http.log 2>&1 & S=$!; trap 'kill "$S" || true' EXIT
          # Keep several example exports as ephemeral QA artefacts, never as production city packages.
          sed -i '/if i in (0,8,20):page.screenshot/i\   if i in (0,8,20): (out/(str(i)+".stl")).write_bytes(payload)' relief-studio/source/tests/atlas-browser.py
          python relief-studio/source/tests/atlas-browser.py http://127.0.0.1:8120/relief-studio/ evidence ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'area-${{ matrix.shard }}', path: 'evidence/', retention-days: 3}
  evidence:
    needs: [package,locations]
    if: ${{ always() && needs.package.result == 'success' }}
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.package.outputs.commit }}'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'area-*', path: matrix, merge-multiple: true}
      - run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          r=[item for f in sorted(Path('matrix').glob('matrix-*.json')) for item in json.loads(f.read_text())];result={'workflow':os.getenv('GITHUB_RUN_ID'),'candidate':'${{ needs.package.outputs.commit }}','total':len(r),'passed':sum(x.get('ok') is True and not x.get('errors') for x in r),'cases':r};out=Path('relief-studio/reports/global');out.mkdir(parents=True,exist_ok=True);(out/'matrix.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n');print(result['total'], result['passed']);
          PY
          git config user.name 'Relief Studio CI'; git config user.email 'github-actions[bot]@users.noreply.github.com'; git add relief-studio/reports/global/matrix.json; git commit -m 'Record independent 24-area cold browser downloads and mesh checks'
          git push origin HEAD:refs/heads/evidence/global-${GITHUB_RUN_ID}
      - uses: actions/upload-artifact@v4
        with: {name: consolidated-matrix, path: relief-studio/reports/global/matrix.json, retention-days: 7}
