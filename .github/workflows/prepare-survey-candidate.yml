name: Prepare public city survey tiles
on:
  push:
    branches: [feature/surveyed-city-surface]
    paths: [.github/workflows/prepare-survey-candidate.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install rasterio numpy pyproj
      - name: Deliver only public LGL height tiles and their attribution to a candidate
        run: |
          set -eu
          cd relief-studio/source
          python tools/prepare_city_surface.py public/survey29
          cd ../..
          git config user.name 'Relief Studio CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add relief-studio/source/public/survey29
          git commit -m 'Publish compact surveyed surface heights with source attribution'
          git push origin HEAD:refs/heads/data/city-surface-${GITHUB_RUN_ID}
      - uses: actions/upload-artifact@v4
        with:
          name: public-surfaces
          path: relief-studio/source/public/survey29/
          retention-days: 2
