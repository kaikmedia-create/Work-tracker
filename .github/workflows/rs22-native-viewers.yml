name: Native Safari and Chromium HD preview smoke test
on:
  push:
    branches: [qa/rs22-safari-preview]
permissions:
  contents: read
jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test client
        run: |
          python3 -m venv "$RUNNER_TEMP/hd-venv"
          "$RUNNER_TEMP/hd-venv/bin/pip" -q install selenium
          if [ "$RUNNER_OS" = macOS ]; then sudo safaridriver --enable; fi
      - name: Render 1.71 million indexed triangles with identical buffers through a drag
        run: |
          cd relief-studio/source/public
          cat > hd-smoke.html <<'HTML'
          <!doctype html><meta charset=utf-8><div id=view-model><canvas width=600 height=480 style="width:600px;height:480px" id=c></canvas><button id=model-hd>HD</button><span class=model-tip></span></div><script src="core.js"></script><script src="viewer.js"></script>
          HTML
          python3 -m http.server 8155 --bind 127.0.0.1 > /tmp/hd-http.log 2>&1 &
          "$RUNNER_TEMP/hd-venv/bin/python" - <<'PY'
          import os,json,time
          from selenium import webdriver
          if os.environ['RUNNER_OS']=='macOS': d=webdriver.Safari()
          else:
            op=webdriver.ChromeOptions()
            for arg in ['--headless','--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']:op.add_argument(arg)
            d=webdriver.Chrome(options=op)
          try:
            d.get('http://127.0.0.1:8155/hd-smoke.html')
            result=d.execute_script('''
            const canvas=document.getElementById('c'),viewer=new RS.ModelViewer(canvas); if(!viewer.gl)throw Error('WebGL2 unavailable on this runner');
            const gl=viewer.gl;let uploads=0,lastDraw=0;const bu=gl.bufferData,dr=gl.drawElements;gl.bufferData=function(...args){uploads++;return bu.apply(this,args)};gl.drawElements=function(...args){lastDraw=args[1];return dr.apply(this,args)};
            function grid(n){const m=n*n,v=new Float32Array(m*3),classes=new Uint8Array(m),idx=new Uint32Array(6*(n-1)*(n-1));let k=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++){let i=y*n+x;v[3*i]=100*x/(n-1)-50;v[3*i+1]=100*y/(n-1)-50;v[3*i+2]=3+Math.sin(x*.024)+Math.cos(y*.03);if(x+1<n&&y+1<n){idx[k++]=i;idx[k++]=i+1;idx[k++]=i+n;idx[k++]=i+n;idx[k++]=i+1;idx[k++]=i+n+1;}}return {vertices:v,classes,indices:idx,width:100,height:100,zmax:5,grid:[n,n]};}
            const mesh=grid(927);mesh.preview=grid(49);viewer.setMesh(mesh,{style:'ivory'});viewer.render();const init=uploads,still=lastDraw;
            viewer.last=[12,12];viewer.yaw+=.3;viewer.render();const drag=lastDraw;gl.finish();const px=new Uint8Array(4);gl.readPixels(canvas.width>>1,canvas.height>>1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);document.getElementById('model-hd').click();viewer.render();const fast=lastDraw;
            document.getElementById('model-hd').click();viewer.render();return {triangles:mesh.indices.length/3,expected:mesh.indices.length,still,drag,fast,resumed:lastDraw,initialUploads:init,totalUploads:uploads,centerAlpha:px[3],glError:gl.getError()};''')
            r=result;assert r['still']==r['drag']==r['resumed']==r['expected'] and r['fast']<r['drag'] and r['totalUploads']==r['initialUploads'] and r['centerAlpha']>0 and r['glError']==0,r
            report={'os':os.environ['RUNNER_OS'],'browser':d.capabilities.get('browserName'),'version':d.capabilities.get('browserVersion'),'syntheticTest':r};print(json.dumps(report));open(os.environ['RUNNER_TEMP']+'/graphics.json','w').write(json.dumps(report))
          finally:d.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hd-${{ runner.os }}
          path: ${{ runner.temp }}/graphics.json
          retention-days: 7
