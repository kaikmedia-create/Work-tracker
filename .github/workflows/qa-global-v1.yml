name: Global source acceptance
on:
  push:
    branches: [dev/global-source-baseline]
    paths: ['.github/workflows/qa-global-v1.yml','relief-studio/source/tools/build_global_candidate.sh','relief-studio/source/tests/global_unit_trigger']
permissions: {contents: read}
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: write}
    outputs: {candidate: '${{ steps.stage.outputs.sha }}'}
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 2}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: bash relief-studio/source/tools/build_global_candidate.sh
    - name: Stage candidate only. Production ref is never moved by this job.
      id: stage
      run: |
        git rm .github/workflows/qa-global-v1.yml .github/workflows/inspect-global-archives.yml
        git add relief-studio
        git config user.name 'Relief Studio QA'; git config user.email 'github-actions[bot]@users.noreply.github.com'
        git fetch --quiet --depth 1 origin b95db64dc13838621846a805551eb974ffa8467b
        SHA=$(git commit-tree "$(git write-tree)" -p b95db64dc13838621846a805551eb974ffa8467b -m 'Coordinate-based sources, bounded global archives and closed STL fallback')
        git push origin "$SHA:refs/heads/candidate/global-base-$GITHUB_RUN_ID"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  suite:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: {ref: '${{ needs.assemble.outputs.candidate }}',persist-credentials: false}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: cd relief-studio/source && npm test > /tmp/unit.txt || { grep -A12 '^not ok' /tmp/unit.txt | cut -c1-180 | head -100; exit 1; }
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: global-unit, path: /tmp/unit.txt,retention-days: 4}
  live:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {region: [AF,EU,AS,NA,SA,OC]}
    steps:
    - uses: actions/checkout@v4
      with: {ref: '${{ needs.assemble.outputs.candidate }}',persist-credentials: false}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: npm install --prefix /tmp/world-qa --ignore-scripts --no-audit --no-fund pngjs@7.0.0
    - name: Fresh global geometry and closed STL, warm cache replay
      working-directory: relief-studio/source
      run: RS_PNG_MODULE=/tmp/world-qa/node_modules/pngjs node --max-old-space-size=4800 tests/global_exports.mjs '${{ matrix.region }}' /tmp/real-exports 0.5
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: 'world-${{ matrix.region }}', path: /tmp/real-exports/*.json, retention-days: 4}
  browser:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: {image: 'mcr.microsoft.com/playwright/python:v1.57.0-noble', options: '--ipc=host'}
    steps:
    - uses: actions/checkout@v4
      with: {ref: '${{ needs.assemble.outputs.candidate }}',persist-credentials: false}
    - run: |
        pip -q install playwright==1.57.0
        python -m http.server 8195 --bind 127.0.0.1 --directory relief-studio/source/public >/tmp/http.log 2>&1 &
        pid=$!; trap 'kill $pid || true' EXIT
        python relief-studio/source/tests/global_browser.py /tmp/world-browser http://127.0.0.1:8195/
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: world-browser, path: /tmp/world-browser, retention-days: 4}
