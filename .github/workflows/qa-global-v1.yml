name: Global baseline acceptance
on:
  push:
    branches: [dev/global-source-baseline]
    paths: ['.github/workflows/qa-global-v1.yml','relief-studio/source/tests/global_unit_trigger']
permissions: {contents: read}
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    outputs: {candidate: '${{ steps.stage.outputs.sha }}'}
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - name: Assemble native and encrypted browser entries
      working-directory: relief-studio/source
      run: |
        set -eu
        node tools/prepare_release28.mjs
        python3 tools/install_global_cycle.py
        sed -i 's/<details class="model-only" id="global-plan">/<details data-mode-only="model" id="global-plan">/' /dev/null 2>/dev/null || true
        npm install --prefix /tmp/rs-vendor --ignore-scripts --no-audit --no-fund esbuild@0.25.12 polygon-clipping@0.15.7 splaytree@3.1.2 robust-predicates@3.0.2
        /tmp/rs-vendor/node_modules/.bin/esbuild /tmp/rs-vendor/node_modules/polygon-clipping/dist/polygon-clipping.esm.js --bundle --minify --format=esm --outfile=public/global-overlay.js
        for p in polygon-clipping splaytree robust-predicates;do f=$(find /tmp/rs-vendor/node_modules/$p -maxdepth 1 -iname 'license*' | head -1); test -n "$f"; cp "$f" "public/global-$p-LICENSE.txt"; done
        cp /tmp/rs-vendor/package-lock.json tools/global-vendor-lock.json
        python3 - <<'PY'
        import urllib.request,json,concurrent.futures,pathlib
        release='2026-10-21.0'
        def collect(k):
         u=f'https://stac.overturemaps.org/{release}/{k}/collection.json';j=json.load(urllib.request.urlopen(u,timeout=20));assert j['type']=='Collection' and j['license'].lower()=='odbl-1.0',(k,j.get('license'));return k,{'release':release,'license':'ODbL-1.0','use':'geometry','stac':u,'spatialExtent':j['extent']['spatial'],'temporalExtent':j['extent']['temporal'],'acquisition':None}
        keys=['buildings/building','buildings/building_part','base/water','base/land','base/land_use','transportation/segment'];p=dict(concurrent.futures.ThreadPoolExecutor(3).map(collect,keys));pathlib.Path('public/global-stac.json').write_text(json.dumps(p,indent=2)+'\n')
        PY
        node -e 'const fs=require("fs"),p=require("./package.json");p.scripts.test+=" tests/global_cycle.test.mjs";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
        node tools/prepare_release28.mjs
    - name: Stage candidate; never update main here
      id: stage
      run: |
        git rm .github/workflows/qa-global-v1.yml .github/workflows/inspect-global-archives.yml
        git add relief-studio
        git config user.name 'Relief Studio QA'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        SHA=$(git commit-tree "$(git write-tree)" -p b95db64dc13838621846a805551eb974ffa8467b -m 'Coordinate-based global sources and printable Overture/OSM baseline')
        git push origin "$SHA:refs/heads/candidate/global-base-$GITHUB_RUN_ID"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  suite:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: {ref: '${{ needs.assemble.outputs.candidate }}',persist-credentials: false}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: cd relief-studio/source && npm test > /tmp/unit.txt || { grep -A12 '^not ok' /tmp/unit.txt | cut -c1-180 | head -100; exit 1; }
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: global-unit, path: /tmp/unit.txt,retention-days: 4}
  live:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: {region: [AF,EU,AS,NA,SA,OC]}
    steps:
    - uses: actions/checkout@v4
      with: {ref: '${{ needs.assemble.outputs.candidate }}',persist-credentials: false}
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: npm install --prefix /tmp/world-qa --ignore-scripts --no-audit --no-fund pngjs@7.0.0
    - name: Fetch actual data and verify re-read STL
      working-directory: relief-studio/source
      run: RS_PNG_MODULE=/tmp/world-qa/node_modules/pngjs node --max-old-space-size=4800 tests/global_exports.mjs '${{ matrix.region }}' /tmp/real-exports 0.5
    - if: always()
      uses: actions/upload-artifact@v4
      with: {name: 'world-${{ matrix.region }}', path: /tmp/real-exports/*.json, retention-days: 4}
