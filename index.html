<style>
:root{color-scheme:dark;--bg:#070b14;--card:#101827;--text:#f7f9fc;--muted:#8491a6;--blue:#67a4ff;--green:#63dc95;--row:58px}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% -5%,#1b4380 0,transparent 34%),radial-gradient(circle at 100% 0,#221a46 0,transparent 26%),linear-gradient(#0a0f1b,#05070d)}.app{width:min(100%,560px);margin:auto}.brand{display:flex;align-items:center;gap:12px;padding:7px 4px 17px}.brand img{width:48px;height:48px;border-radius:15px}.bn{font-weight:800;font-size:1.08rem}.bs{color:var(--muted);font-size:.78rem;margin-top:2px}.card{padding:22px;border:1px solid #ffffff12;border-radius:28px;background:linear-gradient(180deg,#121c2fde,#0c1321dc);box-shadow:0 24px 70px #0007}.ey{margin:0 0 8px;color:#82b5ff;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.label{margin:14px 2px 9px;color:#aeb8c8;font-size:.78rem;font-weight:750}.picker{height:calc(var(--row)*5);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:relative;overflow:hidden;border:1px solid #ffffff0e;border-radius:24px;background:#070c16}.picker:before,.picker:after{content:"";position:absolute;left:0;right:0;height:calc(var(--row)*2);z-index:4;pointer-events:none}.picker:before{top:0;background:linear-gradient(#080d17 5%,#080d17bd,transparent)}.picker:after{bottom:0;background:linear-gradient(transparent,#080d17bd,#080d17)}.sel{position:absolute;z-index:1;left:11px;right:11px;top:50%;height:var(--row);transform:translateY(-50%);border-radius:15px;border:1px solid #82b5ff41;background:#67a4ff18}.wheel{z-index:2;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-block:calc(var(--row)*2);touch-action:pan-y;overscroll-behavior:contain;cursor:ns-resize;outline:none}.wheel:focus-visible{box-shadow:inset 0 0 0 2px #67a4ff55;border-radius:18px}.wheel::-webkit-scrollbar{display:none}.item{height:var(--row);display:grid;place-items:center;scroll-snap-align:center;scroll-snap-stop:always;font-size:2rem;font-weight:650;color:#59667b;user-select:none}.item.on{color:white;transform:scale(1.04)}.colon{z-index:3;font-size:2rem;font-weight:800}.hint{text-align:center;color:#667287;font-size:.73rem;margin-top:8px}.result{margin-top:18px;padding:20px;border:1px solid #63dc9521;border-radius:24px;background:radial-gradient(circle at 95% 0,#63dc951c,transparent 35%),linear-gradient(#0e211f,#0a171d)}.rl{color:#8ca59a;font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.time{margin-top:4px;color:#70e09c;font-size:clamp(4.1rem,21vw,6.5rem);font-weight:800;line-height:.95;letter-spacing:-.075em}.detail{margin-top:10px;color:#91a299;font-size:.88rem}.cd{margin-top:15px;padding-top:14px;border-top:1px solid #ffffff10;font-weight:750}.track{height:7px;margin-top:10px;border-radius:99px;background:#ffffff10;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#4bc77f,#72e6a3);border-radius:99px}.day{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px;border:1px solid #ffffff0d;border-radius:19px;background:#ffffff08}.small{color:var(--muted);font-size:.69rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.select-wrap{position:relative;display:inline-block}.select-wrap:after{content:"⌄";position:absolute;right:11px;top:50%;transform:translateY(-55%);pointer-events:none;color:#91bdff;font-weight:800}.dayselect{appearance:none;-webkit-appearance:none;min-width:150px;padding:9px 34px 9px 11px;border:1px solid #ffffff12;border-radius:12px;background:#0a111d;color:#fff;font:inherit;font-weight:800;outline:none;cursor:pointer}.dayselect:focus{border-color:#67a4ff55;box-shadow:0 0 0 3px #67a4ff18}.pill{padding:8px 11px;border:1px solid #67a4ff35;border-radius:99px;background:#67a4ff15;color:#91bdff;font-size:.76rem;font-weight:750;white-space:nowrap}.pill.free{color:#ff9a9a;border-color:#ff6b6b2f;background:#ff6b6b12}.daynote{margin-top:7px;color:#647187;font-size:.69rem}.actions{display:flex;gap:9px;margin-top:13px}.btn{min-height:44px;padding:0 15px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff09;color:#dce7f7;font-weight:750}.btn.primary{color:#a9cbff;border-color:#67a4ff31;background:#67a4ff17}.install{display:none;margin-left:auto}.foot{display:flex;justify-content:space-between;gap:10px;margin:13px 8px 0;color:#58667c;font-size:.69rem}@media(display-mode:standalone){.install{display:none!important}}
</style>

<body><main class="app"><header class="brand"><img src="icon.svg" alt=""><div><div class="bn">Zeiten</div><div class="bs">Dein Arbeitstag auf einen Blick.</div></div></header><section class="card"><p class="ey">Arbeitszeit</p><div class="label">Anfangszeit</div><div class="picker"><div class="sel"></div><div class="wheel" id="hours" aria-label="Stunden"></div><div class="colon">:</div><div class="wheel" id="mins" aria-label="Minuten"></div></div><div class="hint">Mausrad, Trackpad oder anklicken · Standard 07:00</div><div class="result"><div class="rl">Dein Feierabend</div><div class="time" id="finish">--:--</div><div class="detail" id="detail">–</div><div class="cd" id="countdown"></div><div class="track"><div class="bar" id="bar"></div></div></div><div class="day"><div><div class="small">Tag</div><div class="select-wrap"><select class="dayselect" id="daySelect" aria-label="Wochentag"><option value="1">Montag</option><option value="2">Dienstag</option><option value="3">Mittwoch</option><option value="4">Donnerstag</option><option value="5">Freitag</option><option value="6">Samstag</option><option value="0">Sonntag</option></select></div><div class="daynote" id="dayNote">Automatisch erkannt</div></div><div class="pill" id="schedule">–</div></div><div class="actions"><button class="btn primary" id="now">Jetzt als Start</button><button class="btn install" id="install">App installieren</button></div></section><footer class="foot"><span>Mo–Do 9:30 h · Fr 6:00 h</span><span id="date"></span></footer></main>
<script>
const S={1:570,2:570,3:570,4:570,5:360},R=58,$=id=>document.getElementById(id);let h=7,m=0,start,end,deferred,ht,mt;let selectedDay=new Date().getDay();const H=$('hours'),M=$('mins'),pad=n=>String(n).padStart(2,'0'),dur=n=>`${Math.floor(n/60)}:${pad(n%60)} h`,clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function fill(el,max){for(let i=0;i<=max;i++){let x=document.createElement('div');x.className='item';x.dataset.v=i;x.textContent=pad(i);x.onclick=()=>el.scrollTo({top:i*R,behavior:'smooth'});el.appendChild(x)}}function val(el,max){return clamp(Math.round(el.scrollTop/R),0,max)}function mark(){H.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));M.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));H.querySelector(`[data-v="${h}"]`)?.classList.add('on');M.querySelector(`[data-v="${m}"]`)?.classList.add('on')}function snap(el,max,type){let v=val(el,max);el.scrollTo({top:v*R,behavior:'smooth'});type==='h'?h=v:m=v;mark();calc()}function choose(el,max,type,v,smooth=true){v=clamp(v,0,max);type==='h'?h=v:m=v;el.scrollTo({top:v*R,behavior:smooth?'smooth':'auto'});mark();calc()}
function bind(el,max,type){let lastWheel=0;el.tabIndex=0;el.setAttribute('role','listbox');el.addEventListener('wheel',e=>{e.preventDefault();let d=e.deltaY||e.deltaX;if(!d)return;let now=performance.now();if(now-lastWheel<75)return;lastWheel=now;let cur=type==='h'?h:m;choose(el,max,type,cur+(d>0?1:-1),true)},{passive:false});el.addEventListener('keydown',e=>{let step=0;if(e.key==='ArrowDown')step=1;if(e.key==='ArrowUp')step=-1;if(e.key==='PageDown')step=5;if(e.key==='PageUp')step=-5;if(!step)return;e.preventDefault();let cur=type==='h'?h:m;choose(el,max,type,cur+step,true)});el.addEventListener('scroll',()=>{let v=val(el,max);type==='h'?h=v:m=v;mark();calc();if(type==='h'){clearTimeout(ht);ht=setTimeout(()=>snap(el,max,type),120)}else{clearTimeout(mt);mt=setTimeout(()=>snap(el,max,type),120)}},{passive:true})}
function updateDayUI(){let actual=new Date().getDay(),mins=S[selectedDay];$('daySelect').value=String(selectedDay);$('schedule').textContent=mins?`${dur(mins)}`:'Frei';$('schedule').classList.toggle('free',!mins);$('dayNote').textContent=selectedDay===actual?'Automatisch erkannt':'Manuell gewählt'}
function calc(){let n=new Date(),d=S[selectedDay],actual=n.getDay();if(!d){start=end=null;$('finish').textContent='Frei';$('detail').textContent='Samstag und Sonntag sind freie Tage.';$('countdown').textContent='Kein Arbeitstag.';$('bar').style.width='100%';return}start=new Date(n.getFullYear(),n.getMonth(),n.getDate(),h,m);end=new Date(start.getTime()+d*60000);$('finish').textContent=`${pad(end.getHours())}:${pad(end.getMinutes())}`;$('detail').textContent=`Start ${pad(h)}:${pad(m)} · ${dur(d)} Gesamtzeit`;if(selectedDay!==actual){$('countdown').textContent='Manuell gewählter Tag · reine Zeitberechnung';$('bar').style.width='0%';return}tick()}
function tick(){if(!start||!end)return;if(selectedDay!==new Date().getDay())return;let now=Date.now(),total=end-start,elapsed=now-start,diff=end-now;$('bar').style.width=`${clamp(elapsed/total*100,0,100)}%`;if(diff<=0){$('countdown').textContent='Feierabend erreicht ✓';$('bar').style.width='100%';return}if(now<start){$('countdown').textContent='Arbeitstag hat noch nicht begonnen.';$('bar').style.width='0%';return}let s=Math.floor(diff/1000),hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;$('countdown').textContent=`Noch ${hh?hh+' h ':''}${mm} min ${pad(ss)} s`}
function setTime(a,b,smooth=true){h=a;m=b;H.scrollTo({top:a*R,behavior:smooth?'smooth':'auto'});M.scrollTo({top:b*R,behavior:smooth?'smooth':'auto'});mark();calc()}
$('daySelect').addEventListener('change',e=>{selectedDay=Number(e.target.value);updateDayUI();calc()});$('now').onclick=()=>{let n=new Date();setTime(n.getHours(),n.getMinutes())};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='inline-flex'});$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').style.display='none'};fill(H,23);fill(M,59);bind(H,23,'h');bind(M,59,'m');$('date').textContent=new Intl.DateTimeFormat('de-DE').format(new Date());updateDayUI();requestAnimationFrame(()=>setTime(7,0,false));setInterval(tick,1000);setInterval(()=>{$('date').textContent=new Intl.DateTimeFormat('de-DE').format(new Date())},60000);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
