<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Weinheim – 3D regression test</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f5f3;color:#22312d}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{width:900px;max-width:100%;height:600px;background:#eee}button,a{margin:8px;padding:10px}#diagnostic{font:11px monospace}</style>
<h1>Weinheim: echter Datenabruf und 3D-Test</h1><p>Technische Diagnose. OSM © OpenStreetMap contributors, ODbL; Gelände Mapzen/AWS. Kandidat verändert nur diese Testsitzung.</p>
<button id="run">Test starten</button><strong id="state">BEREIT</strong><pre id="progress"></pre><canvas id="model"></canvas><pre id="result"></pre><pre id="diagnostic"></pre>
<script src="../public/core.js"></script><script src="../public/data.js"></script><script src="../public/viewer.js"></script>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const hash=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))),v=>v.toString(16).padStart(2,'0')).join('');
async function run(){
 $('run').disabled=true;$('state').textContent='LAEUFT';const start=Date.now();
 const size=Math.min(5,Math.max(.5,Number(params.get('size'))||4)),bounds=RS.boundsFor(8.684,49.549,size,size);
 const report={sizeKm:size,bounds,startedAt:new Date().toISOString(),source:'OpenStreetMap + Mapzen/AWS',candidate:params.get('candidate')==='1',status:'running'};window.testReport=report;
 try{
  const loader=RS.createDataLoader({config:{sessionMs:240000}});
  const data=await loader.loadMap(bounds,{mode:'model',terrainRequired:true,onProgress:e=>{$('progress').textContent=JSON.stringify({elapsed:Math.round((Date.now()-start)/1000),...e});}});
  window.testData=data;report.buildings=data.buildings.length;report.terrain={cols:data.terrain.cols,rows:data.terrain.rows,tileCount:data.terrain.tileCount};report.osmTimestamp=data.osmTimestamp;
  $('progress').textContent='Geladen: '+report.buildings+' Gebäude. Modell wird berechnet.';
  let [core,source]=await Promise.all(['core.js','architecture.js'].map(n=>fetch('../public/'+n,{cache:'no-store'}).then(r=>r.text())));
  if(report.candidate){const p=await (await fetch('../../candidate14.json',{cache:'no-store'})).json(),c=p.changes['public/architecture.js'];if(await hash(source)!==c.base)throw Error('Kandidaten-Basis stimmt nicht');const lines=source.split('\n');for(const [start,count,add] of c.edits.slice().reverse())lines.splice(start,count,...add);source=lines.join('\n');if(await hash(source)!==c.result)throw Error('Kandidaten-Prüfsumme stimmt nicht');report.geometryHash=c.result;}
  let marked=source.replace("if(list.length>2)throw Error('Überlagerte Gebäudekanten konnten nicht sauber verbunden werden. Bitte einen kleineren Ausschnitt wählen.');",`if(list.length>2)throw Object.assign(Error('Überlagerte Gebäudekanten'),{detail:{edges:list.map(e=>({a:xy[e.a],b:xy[e.b],f:e.f})),faces:list.map(e=>({poly:faces[e.f].poly,plane:faces[e.f].plane,kind:faces[e.f].kind,building:faces[e.f].building})),W,H}});`);
  marked=marked.replace("throw Error('Eine Gebäudenaht konnte nicht geschlossen werden. Bitte einen kleineren Ausschnitt wählen; kein unvollständiges Modell wurde exportiert.');",`throw Object.assign(Error('Offene XY-Naht'),{detail:{a,b,faces:faces.filter(f=>f.poly.some(p=>Math.hypot(p[0]-a[0],p[1]-a[1])<.01)).slice(0,12).map(f=>({poly:f.poly,plane:f.plane,building:f.building})),W,H}});`);
  marked=marked.replace("throw Error('Die Gebäudegeometrie enthält eine nicht druckbare Naht. Bitte einen kleineren Ausschnitt wählen. Ein fehlerhaftes Modell wurde nicht freigegeben.');",`throw Object.assign(Error('Offene 3D-Naht'),{detail:{badCount:bad.length,bad:bad.slice(0,12).map(([k,v])=>({a:Array.from(vs.slice(Math.floor(k/count)*3,Math.floor(k/count)*3+3)),b:Array.from(vs.slice((k%count)*3,(k%count)*3+3)),usage:v})),faces:[]}});`);
  const code=core+'\n'+marked+`\nonmessage=e=>{try{const t=performance.now(),m=RS.buildMesh(e.data.data,e.data.settings),buildMs=Math.round(performance.now()-t);const stl=RS.stl(m),three=RS.model3mf(m,'Weinheim');postMessage({mesh:m,buildMs,stlBytes:stl.byteLength,threeBytes:three.size});}catch(error){postMessage({error:error.message,detail:error.detail,stack:error.stack});}};`;
  const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'})),worker=new Worker(url);URL.revokeObjectURL(url);
  const result=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{worker.terminate();reject(Error('Modell-Testzeitlimit 120 s'));},120000);worker.onmessage=e=>{clearTimeout(timer);resolve(e.data);};worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message));};worker.postMessage({data,settings:{modelWidth:200,frame:4,resolution:161,mode:'model'}});});worker.terminate();
  if(result.error){report.status='failed';report.error=result.error;report.stack=result.stack;if(result.detail){report.detail=result.detail;const ids=[...new Set((result.detail.faces||[]).map(f=>f.building).filter(Number.isInteger))];report.involvedBuildings=ids.map(i=>data.buildings[i]);}$('diagnostic').textContent=JSON.stringify({detail:report.detail,buildings:report.involvedBuildings});}
  else{report.status='passed';report.buildMs=result.buildMs;report.triangles=result.mesh.indices.length/3;report.vertices=result.mesh.vertices.length/3;report.architecture=result.mesh.architecture;report.stlBytes=result.stlBytes;report.threeMFBytes=result.threeBytes;const viewer=new RS.ModelViewer($('model'));viewer.setMesh(result.mesh,RS.cleanSettings());window.testMesh=result.mesh;}
 }catch(e){report.status='failed';report.error=e.message;}
 report.elapsedMs=Date.now()-start;$('state').textContent=report.status==='passed'?'PASS':'FAIL';const {detail,involvedBuildings,...compact}=report;$('result').textContent=JSON.stringify(compact,null,2);window.testReport=report;
}
$('run').onclick=run;if(params.get('run')==='1')run();
</script></html>
